name: Apply tested Voice operator

on:
  push:
    branches: [bb/retrieve-latest-voice-transcript-thr_5pn749uenj]
    paths: ['.github/voice-operator/**', '.github/workflows/apply-voice-operator.yml']

permissions:
  contents: read

concurrency:
  group: apply-voice-operator
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/bb/retrieve-latest-voice-transcript-thr_5pn749uenj'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply verified source changes
        run: python .github/voice-operator/apply.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/voice-mode/package-lock.json
      - run: npm ci --include=dev
        working-directory: plugins/voice-mode
      - run: npm run typecheck
        working-directory: plugins/voice-mode
      - run: npm test
        working-directory: plugins/voice-mode
      - run: npm run build:check
        working-directory: plugins/voice-mode

  commit:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reapply identical verified source changes
        run: python .github/voice-operator/apply.py
      - name: Commit only the verified source files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const branch = 'bb/retrieve-latest-voice-transcript-thr_5pn749uenj';
            if (context.ref !== `refs/heads/${branch}`) throw new Error('Wrong branch');
            const {owner, repo} = context.repo;
            const manifest = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/voice-implementation-manifest.json`, 'utf8'));
            if (manifest.length !== 26) throw new Error('Unexpected manifest');
            const ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            if (ref.data.object.sha !== context.sha) throw new Error('Branch advanced; refusing to overwrite newer work');
            const parent = await github.rest.git.getCommit({owner, repo, commit_sha: context.sha});
            const tree = [];
            for (const item of manifest) {
              if (item.path !== 'README.md' && !item.path.startsWith('plugins/voice-mode/')) throw new Error('Unlisted path');
              if (item.path.split('/').includes('..')) throw new Error('Invalid path');
              const content = fs.readFileSync(item.path);
              const sha = crypto.createHash('sha1').update(`blob ${content.length}\0`).update(content).digest('hex');
              if (sha !== item.sha) throw new Error(`Source changed after validation: ${item.path}`);
              const blob = await github.rest.git.createBlob({owner, repo, content: content.toString('base64'), encoding: 'base64'});
              if (blob.data.sha !== sha) throw new Error('Uploaded blob mismatch');
              tree.push({path: item.path, mode: '100644', type: 'blob', sha});
            }
            const createdTree = await github.rest.git.createTree({owner, repo, base_tree: parent.data.tree.sha, tree});
            const commit = await github.rest.git.createCommit({owner, repo, message: 'feat(voice): add live operator, fast coordinator, and worker profiles', tree: createdTree.data.sha, parents: [context.sha]});
            const latest = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            if (latest.data.object.sha !== context.sha) throw new Error('Branch advanced during upload; refusing to overwrite');
            await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false});
            core.info(`Implementation commit: ${commit.data.sha}`);
            await core.summary.addHeading('Voice implementation validated and committed').addRaw(`Commit: ${commit.data.sha}`).write();
