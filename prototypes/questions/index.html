<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB questions: Notebook side panel</title>
<style>
/* Tokens derived from the installed BB app CSS (index-Cau48VxT.css). */
:root, .dark {
  color-scheme: dark;
  --canvas: oklch(19.5% 0 0);
  --ink: oklch(81% 0 0);
  --primary: oklch(82% 0 0);
  --primary-foreground: oklch(21.78% 0 0);
  --secondary: color-mix(in oklch, var(--ink) 13%, var(--canvas));
  --accent: color-mix(in oklch, var(--ink) 13%, var(--canvas));
  --muted: color-mix(in oklch, var(--ink) 16%, var(--canvas));
  --muted-foreground: oklch(78% 0 0);
  --subtle-foreground: oklch(68% 0 0);
  --border: color-mix(in oklch, var(--ink) 19.4%, var(--canvas));
  --border-seam: color-mix(in oklch, var(--ink) 11%, var(--canvas));
  --input: color-mix(in oklch, var(--ink) 32.6%, var(--canvas));
  --state-hover: color-mix(in oklab, var(--ink) 13.8%, transparent);
  --state-active: color-mix(in oklab, var(--ink) 22.5%, transparent);
  --surface-recessed: color-mix(in oklab, var(--ink) 6%, transparent);
  --surface-raised: color-mix(in oklab, var(--ink) 2.5%, var(--canvas));
  --surface-selected: color-mix(in oklab, var(--primary) 12%, transparent);
  --surface-selected-border: color-mix(in oklab, var(--primary) 35%, transparent);
  --sidebar: color-mix(in oklch, var(--ink) 4.3%, var(--canvas));
  --destructive: oklch(56% .19 22.17);
  --destructive-text: oklch(65% .16 22);
  --surface-destructive: color-mix(in oklab, var(--destructive) 8%, transparent);
  --surface-destructive-border: color-mix(in oklab, var(--destructive) 30%, transparent);
  --warning-text: oklch(75% .16 50);
  --success: oklch(74% .15 155);
  --timeline-accent: oklch(72% .09 250);
  --shadow-sm: 0px 2px 0px 0px #0000004d, 0px 1px 2px -1px #0006;
}
.light {
  color-scheme: light;
  --canvas: oklch(100% 0 0);
  --ink: oklch(32.11% 0 0);
  --primary: oklch(27% 0 0);
  --primary-foreground: oklch(100% 0 0);
  --secondary: color-mix(in oklch, var(--ink) 8%, var(--canvas));
  --accent: color-mix(in oklch, var(--ink) 8%, var(--canvas));
  --muted: color-mix(in oklch, var(--ink) 11%, var(--canvas));
  --muted-foreground: oklch(44% 0 0);
  --subtle-foreground: oklch(50% 0 0);
  --border: color-mix(in oklch, var(--ink) 14%, var(--canvas));
  --border-seam: color-mix(in oklch, var(--ink) 9.5%, var(--canvas));
  --input: color-mix(in oklch, var(--ink) 29.5%, var(--canvas));
  --state-hover: color-mix(in oklab, var(--ink) 5.9%, transparent);
  --state-active: color-mix(in oklab, var(--ink) 11.8%, transparent);
  --surface-recessed: color-mix(in oklab, var(--ink) 4%, transparent);
  --surface-raised: var(--canvas);
  --surface-selected: color-mix(in oklab, var(--primary) 16%, transparent);
  --surface-selected-border: color-mix(in oklab, var(--primary) 35%, transparent);
  --sidebar: color-mix(in oklch, var(--ink) 2.2%, var(--canvas));
  --destructive: oklch(45% .19 25.86);
  --destructive-text: oklch(45% .19 25.86);
  --surface-destructive: color-mix(in oklab, var(--destructive) 6%, transparent);
  --surface-destructive-border: color-mix(in oklab, var(--destructive) 25%, transparent);
  --warning-text: oklch(55% .14 50);
  --success: oklch(70% .15 155);
  --timeline-accent: oklch(55% .1 250);
  --shadow-sm: 0px 1px 2px 0px #0000001a;
}
:root {
  --background: var(--canvas);
  --foreground: var(--ink);
  --ring: var(--primary);
  --radius: .5rem;
  --radius-md: calc(var(--radius) - 2px);
  --radius-sm: calc(var(--radius) - 4px);
  --font-sans: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --text-xs: .75rem;
  --text-sm: .8125rem;
  --text-base: .9375rem;
  --chrome-row: 3rem;
  --row: 1.75rem;
}
* { box-sizing: border-box; }
html { font-size: 16px; }
html, body { margin: 0; height: 100%; background: var(--background); color: var(--foreground); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
body { font-size: var(--text-sm); line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; pointer-events: none; opacity: .5; }
:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--ring); }
a { color: var(--foreground); }
textarea { resize: vertical; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted-foreground); }
.subtle { color: var(--subtle-foreground); }
.xs { font-size: var(--text-xs); }

/* ---------- proposal switcher (outside the BB chrome) ---------- */
#app { display: flex; flex-direction: column; height: 100%; }
.switcher { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--sidebar); flex-wrap: wrap; font-size: var(--text-xs); }
.switcher .label { color: var(--subtle-foreground); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--radius-md); background: var(--surface-recessed); }
.seg button { background: transparent; border: 0; padding: 3px 9px; border-radius: var(--radius-sm); color: var(--muted-foreground); font-size: var(--text-xs); line-height: 1.3; }
.seg button:hover { background: var(--state-hover); color: var(--foreground); }
.seg button[aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
.switcher .spacer { flex: 1; }
.switcher .demo { color: var(--subtle-foreground); }
.switcher .demo b { color: var(--muted-foreground); font-weight: 500; }

/* ---------- BB-like app chrome ---------- */
.ide { flex: 1; display: grid; grid-template-columns: 1fr auto; grid-template-rows: var(--chrome-row) 1fr; min-height: 0; position: relative; }
.titlebar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--background); font-size: var(--text-sm); color: var(--muted-foreground); }
.titlebar .crumb { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
.titlebar .crumb b { color: var(--foreground); font-weight: 500; }
.titlebar .sep { color: var(--subtle-foreground); }
.titlebar .spacer { flex: 1; }
.tb-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--muted-foreground); font-size: var(--text-xs); font-weight: 500; }
.tb-btn:hover { background: var(--state-hover); color: var(--foreground); }
.tb-btn[aria-pressed="true"] { background: var(--state-active); color: var(--foreground); }
.tb-btn .cnt { color: var(--subtle-foreground); font-variant-numeric: tabular-nums; }
.tb-btn svg { width: 14px; height: 14px; }

.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.thread { flex: 1; overflow: auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 720px; }
.msg .who { font-size: var(--text-xs); color: var(--subtle-foreground); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.msg .body { color: var(--foreground); font-size: var(--text-base); line-height: 1.5; }
.msg.user { align-self: flex-end; width: 100%; display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .body { background: var(--secondary); border-radius: var(--radius); padding: 8px 12px; max-width: 560px; font-size: var(--text-sm); }
.msg.agent .body p { margin: 0 0 8px; }
.msg .body p:last-child { margin-bottom: 0; }
.toolcard { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-raised); max-width: 720px; }
.toolcard .head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: var(--text-xs); color: var(--muted-foreground); flex-wrap: wrap; }
.toolcard .head .name { color: var(--foreground); font-family: var(--font-mono); }
.toolcard .head .st { margin-left: auto; color: var(--subtle-foreground); }
.toolcard .head .st.ok { color: var(--success); }
.toolcard .foot { display: flex; gap: 8px; padding: 6px 10px 8px; align-items: center; flex-wrap: wrap; color: var(--subtle-foreground); font-size: var(--text-xs); border-top: 1px solid var(--border-seam); }
.inthread { max-width: 720px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--background); overflow: hidden; }
.composer { padding: 0 24px 16px; background: var(--background); }
.composer .box { border: 1px solid var(--input); border-radius: var(--radius); background: var(--background); padding: 10px 12px; color: var(--subtle-foreground); display: flex; justify-content: space-between; align-items: center; max-width: 720px; box-shadow: var(--shadow-sm); }
.composer .box span.kbd { font-family: var(--font-mono); font-size: var(--text-xs); }

/* ---------- side pane ---------- */
.panel { border-left: 1px solid var(--border); background: var(--background); display: flex; flex-direction: column; min-height: 0; width: var(--pw, 380px); max-width: 100%; }
.panel[hidden] { display: none; }
.panel .phead { display: flex; align-items: center; gap: 2px; padding: 0 6px 0 8px; border-bottom: 1px solid var(--border); height: 36px; flex: none; }
.panel .phead .ptabs { display: inline-flex; gap: 2px; height: 100%; align-items: center; }
.panel .phead .ptabs button { background: transparent; border: 0; height: 26px; padding: 0 8px; border-radius: var(--radius-md); color: var(--subtle-foreground); font-size: var(--text-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.panel .phead .ptabs button:hover { background: var(--state-hover); color: var(--foreground); }
.panel .phead .ptabs button[aria-selected="true"] { background: var(--state-active); color: var(--foreground); }
.panel .phead .ptabs .n { color: var(--subtle-foreground); font-weight: 400; font-variant-numeric: tabular-nums; }
.panel .phead .spacer { flex: 1; }
.icon-btn { width: 26px; height: 26px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--subtle-foreground); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--state-hover); color: var(--foreground); }
.icon-btn svg { width: 14px; height: 14px; }
.pbody { flex: 1; overflow: auto; min-height: 0; display: flex; flex-direction: column; }
.pfoot { border-top: 1px solid var(--border); padding: 6px 8px 6px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--background); min-height: 40px; }
.pfoot .muted { font-size: var(--text-xs); color: var(--subtle-foreground); }
.storage { font-size: var(--text-xs); color: var(--subtle-foreground); }

/* buttons, after BB button variants */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--input); background: transparent; color: var(--foreground); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; transition: background-color .12s, color .12s; }
.btn:hover { background: var(--state-hover); }
.btn.primary { background: var(--foreground); color: var(--background); border-color: transparent; }
.btn.primary:hover { background: color-mix(in oklab, var(--foreground) 90%, transparent); }
.btn.ghost { border-color: transparent; color: var(--muted-foreground); }
.btn.ghost:hover { background: var(--state-hover); color: var(--foreground); }
.btn.ghost[aria-pressed="true"] { background: var(--state-active); color: var(--foreground); }
.btn.sm { height: 28px; padding: 0 10px; font-size: var(--text-xs); }
.btn.danger { color: var(--destructive-text); }
.btn svg { width: 14px; height: 14px; flex: none; }

/* ---------- question editor ---------- */
.q { padding: 10px 12px 12px; }
.q .qtop { display: flex; align-items: baseline; gap: 8px; }
.q .qnum { font-size: var(--text-xs); color: var(--subtle-foreground); min-width: 26px; font-variant-numeric: tabular-nums; }
.q .qtitle { font-weight: 500; font-size: var(--text-sm); flex: 1; }
.q .qhelp { color: var(--muted-foreground); font-size: var(--text-xs); margin: 4px 0 0 var(--indent, 34px); }
.q .qmeta { display: flex; gap: 10px; margin: 4px 0 0 var(--indent, 34px); align-items: center; font-size: var(--text-xs); color: var(--subtle-foreground); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-xs); color: var(--subtle-foreground); white-space: nowrap; }
.chip.green { color: var(--success); }
.chip.amber { color: var(--warning-text); }
.chip.red { color: var(--destructive-text); }
.chip.blue, .chip.purple { color: var(--muted-foreground); }
.chip.btn-chip { cursor: pointer; background: none; border: 0; padding: 0 4px; border-radius: var(--radius-sm); color: var(--foreground); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--input); }
.chip.btn-chip:hover { background: var(--state-hover); }
.origin { margin: 8px 0 0 var(--indent, 34px); border-left: 2px solid var(--input); padding: 4px 10px; font-size: var(--text-xs); color: var(--muted-foreground); }
.origin.red { border-color: var(--destructive); }
.origin.amber { border-color: var(--warning-text); }
.origin .ohead { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; color: var(--subtle-foreground); }
.origin .ohead b { color: var(--foreground); font-weight: 500; }
.origin .quote { color: var(--subtle-foreground); }
.origin .quote span { color: var(--foreground); }
.opts { margin: 8px 0 0 calc(var(--indent, 34px) - 8px); display: flex; flex-direction: column; gap: 1px; }
.opt { border-radius: var(--radius-md); }
.opt label { display: flex; align-items: center; gap: 10px; min-height: var(--row); padding: 3px 8px; cursor: pointer; border-radius: var(--radius-md); }
.opt label:hover { background: var(--state-hover); }
.opt input { margin: 0; accent-color: var(--primary); width: 14px; height: 14px; }
.opt.on > label { background: var(--surface-selected); }
.opt .txt { flex: 1; }
.opt .detail-toggle { font-size: var(--text-xs); color: var(--subtle-foreground); background: none; border: 0; padding: 2px 6px; border-radius: var(--radius-sm); }
.opt .detail-toggle:hover { color: var(--foreground); background: var(--state-hover); }
.opt .detail { padding: 2px 8px 8px 32px; }
.field { margin: 8px 0 0 var(--indent, 34px); }
.field label, .field .lbl { display: block; font-size: var(--text-xs); color: var(--subtle-foreground); margin-bottom: 4px; }
.ta, .in { width: 100%; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px 8px; color: var(--foreground); font-size: var(--text-sm); }
.ta { min-height: 44px; }
.ta:focus, .in:focus { border-color: var(--input); outline: none; box-shadow: 0 0 0 1px var(--ring); }
.ta::placeholder, .in::placeholder { color: var(--subtle-foreground); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.unknown { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-xs); color: var(--muted-foreground); cursor: pointer; height: 28px; }
.unknown input { accent-color: var(--primary); margin: 0; width: 14px; height: 14px; }
.att-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.att { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 3px 4px 3px 6px; background: var(--surface-raised); font-size: var(--text-xs); max-width: 100%; }
.att img { width: 28px; height: 28px; object-fit: cover; border-radius: 3px; }
.att svg { width: 14px; height: 14px; color: var(--subtle-foreground); }
.att .fname { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .x, .ref .x { border: 0; background: transparent; color: var(--subtle-foreground); width: 18px; height: 18px; border-radius: 3px; display: grid; place-items: center; }
.att .x:hover, .ref .x:hover { background: var(--state-hover); color: var(--foreground); }
.ref { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 2px 4px 2px 6px; background: var(--surface-raised); font-size: var(--text-xs); font-family: var(--font-mono); }
.ref svg { width: 12px; height: 12px; color: var(--subtle-foreground); }
.ref button.open { border: 0; background: transparent; color: var(--foreground); padding: 0 2px; font-family: var(--font-mono); font-size: var(--text-xs); }
.ref button.open:hover { text-decoration: underline; text-underline-offset: 2px; }
.conf { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--radius-md); background: var(--surface-recessed); }
.conf button { background: transparent; border: 0; padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--text-xs); color: var(--muted-foreground); }
.conf button:hover { color: var(--foreground); }
.conf button[aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-sm); }
.qfoot { display: flex; align-items: center; gap: 6px; margin: 10px 0 0 var(--indent, 34px); flex-wrap: wrap; }
.qfoot .status { font-size: var(--text-xs); color: var(--subtle-foreground); flex: 1; min-width: 120px; }
.qfoot .status.ok { color: var(--success); }
.qfoot .status.dirty { color: var(--warning-text); }
.actions { margin: 6px 0 0 calc(var(--indent, 34px) - 8px); display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.hint { font-size: var(--text-xs); color: var(--subtle-foreground); }
.q.notitle { --indent: 0px; padding-top: 4px; }

/* ---------- Notebook ---------- */
.nb-h { margin: 12px 12px 0; font-size: var(--text-xs); font-weight: 500; color: var(--subtle-foreground); height: 24px; display: flex; align-items: center; }
.qb { border-top: 1px solid var(--border-seam); padding: 4px 0 2px; }
.qb:first-of-type, .nb-h + .qb { border-top: 0; }
.qrow { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px 0; }
.qrow .num { font-size: var(--text-xs); color: var(--subtle-foreground); min-width: 26px; font-variant-numeric: tabular-nums; }
.qrow .t { flex: 1; min-width: 0; font-weight: 500; }
.q-controls { display: inline-flex; align-items: center; gap: 4px; flex: 0 0 42px; height: 20px; align-self: flex-start; }
.q-controls .icon-btn { width: 20px; height: 20px; }
.q-state { width: 18px; text-align: center; color: var(--subtle-foreground); font-size: 12px; }
.q-controls.is-empty { visibility: hidden; }
.qb > .q { padding-left: 12px; padding-top: 0; }
/* ---------- References to earlier answers ---------- */
.cites { margin: 6px 0 0 var(--indent, 34px); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.cite { background: var(--surface-recessed); border: 0; border-radius: var(--radius-md); padding: 3px 8px; font-size: var(--text-xs); color: var(--muted-foreground); display: inline-flex; gap: 6px; align-items: baseline; text-align: left; max-width: 100%; }
.cite:hover { background: var(--state-hover); color: var(--foreground); }
.cite[aria-expanded="true"] { background: var(--state-active); color: var(--foreground); }
.cite .cq { color: var(--subtle-foreground); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.cite-box { border-left: 2px solid var(--input); padding: 2px 10px 6px; font-size: var(--text-xs); color: var(--muted-foreground); width: 100%; }
.cite-box .ch { display: flex; align-items: center; gap: 8px; color: var(--subtle-foreground); }
.cite-box .ch .icon-btn { width: 22px; height: 22px; flex-shrink: 0; }
.cite-box .ch .cite-close { margin-left: auto; }
.cite-box .ch { gap: 6px; }
.cite-box .ct { margin-top: 8px; font-size: var(--text-sm); line-height: 1.5; }
.cite-box .answer-label { display: block; color: var(--subtle-foreground); font-size: 11px; margin-bottom: 3px; }
.cite-box .ca { margin-top: 10px; padding: 8px 10px; background: var(--surface-recessed); border-radius: var(--radius-md); line-height: 1.5; }
.cite-box .ct { color: var(--foreground); font-weight: 500; margin-top: 2px; }
.cite-box .ca { color: var(--foreground); margin-bottom: 4px; }
.cite-box .hint { margin-bottom: 4px; }
.qmeta .qstatus:empty { display: none; }
/* ---------- Rounds ---------- */
.rintro { margin: 10px 12px 6px; padding: 0 0 0 10px; border-left: 2px solid var(--input); font-size: var(--text-xs); color: var(--muted-foreground); }
.rintro b { color: var(--foreground); font-weight: 500; }
.round { padding: 0 8px 8px; }
.c-q { border-radius: var(--radius-md); margin-bottom: 1px; }
.c-q:not(.collapsed) { background: var(--surface-raised); margin-bottom: 4px; }
.c-q > .c-head { display: flex; align-items: center; gap: 8px; min-height: var(--row); padding: 4px 8px; background: transparent; border: 0; width: 100%; text-align: left; color: var(--foreground); cursor: pointer; border-radius: var(--radius-md); }
.c-q > .c-head:hover { background: var(--state-hover); }
.c-q:not(.collapsed) > .c-head { background: var(--surface-recessed); border-radius: var(--radius-md) var(--radius-md) 0 0; }
.c-q > .c-head .num { font-size: var(--text-xs); color: var(--subtle-foreground); min-width: 26px; font-variant-numeric: tabular-nums; align-self: flex-start; padding-top: 2px; }
.c-q > .c-head .t { flex: 1; font-weight: 500; }
.c-q > .c-head .t .sub { font-weight: 400; color: var(--subtle-foreground); font-size: var(--text-xs); }
.c-q > .c-head .chip:empty { display: none; }
.c-q.collapsed > .q { display: none; }
.c-q > .q { padding-left: 42px; }
/* ---------- summary (shared) ---------- */
.summary { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.summary .agent-sum { border-left: 2px solid var(--input); padding: 2px 10px; color: var(--muted-foreground); }
.summary .agent-sum .h { font-size: var(--text-xs); color: var(--subtle-foreground); margin-bottom: 2px; display: flex; gap: 8px; align-items: center; }
.summary h4 { margin: 0 0 4px; font-size: var(--text-xs); font-weight: 500; color: var(--subtle-foreground); }
.summary .list { display: flex; flex-direction: column; }
.summary .item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-top: 1px solid var(--border-seam); border-radius: var(--radius-md); }
.summary .item:hover { background: var(--state-hover); }
.summary .item .k { font-size: var(--text-xs); color: var(--subtle-foreground); min-width: 26px; padding-top: 1px; font-variant-numeric: tabular-nums; }
.summary .item .t { flex: 1; min-width: 0; }
.summary .item .t .ans { color: var(--subtle-foreground); font-size: var(--text-xs); }
.summary .item button.link { background: none; border: 0; padding: 0; color: var(--foreground); font-weight: 500; text-align: left; cursor: pointer; font-size: var(--text-sm); border-radius: var(--radius-sm); }
.summary .item button.link:hover { text-decoration: underline; text-underline-offset: 2px; }
.summary .empty { color: var(--subtle-foreground); font-size: var(--text-xs); }

/* ---------- toast ---------- */
.toasts { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 50; }
.toast { background: var(--foreground); color: var(--background); border-radius: var(--radius-md); padding: 8px 12px; font-size: var(--text-xs); box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 320px; }
.toast b { font-weight: 600; }

/* ---------- responsive ---------- */
@media (max-width: 760px) {
  .ide { grid-template-columns: 1fr 0; }
  .panel { position: absolute; top: var(--chrome-row); right: 0; bottom: 0; width: 100%; --pw: 100%; z-index: 10; border-left: 0; }
  .thread { padding: 12px; }
  .composer { padding: 0 12px 12px; }
  .titlebar .crumb .hide-sm, .tb-btn .hide-sm { display: none; }
}
.text-answer { border: 0; background: transparent; padding: 3px 8px; min-height: var(--row); color: var(--muted-foreground); font-size: var(--text-xs); font-weight: 400; }
.opts + .actions:has(.text-answer) { margin-top: 1px; }
.actions:has([data-action="attach"]) { margin-top: 0; }
.actions .attach-icon { width: 28px; height: 28px; }
.text-answer:hover { background: transparent; color: var(--foreground); }
.qmeta:has(.qstatus:empty):not(:has(button)) { display: none; }

.confidence-row { margin: 8px 0 0 var(--indent, 34px); display: flex; align-items: center; gap: 10px; }
.file-input { position: relative; display: flex; align-items: center; }
.file-input .in { width: 100%; padding: 8px 34px; }
.file-input .search-icon { position: absolute; left: 10px; width: 16px; height: 16px; color: var(--subtle-foreground); pointer-events: none; }
.file-caret { position: absolute; right: 4px; top: 0; bottom: 0; margin: auto; width: 28px; height: 28px; border: 0; background: transparent; display: grid; place-items: center; color: var(--subtle-foreground); }
.file-caret svg, .file-option svg, .file-badge > svg { width: 16px; height: 16px; flex-shrink: 0; }
.file-results { margin-top: 4px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius-md); max-height: 220px; overflow-y: auto; background: var(--background); }
.file-option { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 8px; background: transparent; border: 0; border-radius: 4px; font-size: var(--text-xs); font-weight: 400; }
.file-option.active { background: var(--state-hover); }
.file-name { flex-shrink: 0; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }
.file-path { color: var(--subtle-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-check { margin-left: auto; width: 12px; flex-shrink: 0; }
.file-empty { padding: 10px; color: var(--subtle-foreground); font-size: var(--text-xs); }
.file-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.file-badge { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 2px 4px 2px 7px; border-radius: 5px; background: var(--surface-recessed); font-size: var(--text-xs); }
.file-badge-label { border: 0; background: transparent; font-size: inherit; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0; }
.file-badge .icon-btn { width: 20px; height: 20px; }
@media (max-width: 760px) {
  .qrow .t { overflow-wrap: anywhere; }
  .cite { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; padding: 6px 8px; }
  .cite-source { white-space: nowrap; }
  .cite .cq { max-width: 100%; white-space: normal; overflow-wrap: anywhere; text-overflow: clip; }
}
.answer-composer { position: relative; }
.answer-composer .ta { display: block; min-height: 86px; padding-bottom: 34px; }
.answer-composer .attach-icon { position: absolute; left: 5px; bottom: 5px; width: 26px; height: 26px; }
.actions:empty { display: none; }

<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ============================ demo data ============================ */
const GROUPS = [
  { id: 'display', title: 'Display' },
  { id: 'answers', title: 'Answer forms' },
  { id: 'persist', title: 'Drafts and submission' },
  { id: 'agent', title: 'Agent follow-ups' },
];

const SAMPLE_PATHS = [
  'README.md', 'AGENTS.md', 'plugins/activity/app.tsx', 'plugins/activity/server.ts',
  'plugins/voice-mode/app.tsx', 'plugins/voice-mode/companion.tsx', 'plugins/devin/provider.ts',
  'plugins/devin/README.md', 'plugins/provider-usage/', 'https://github.com/get-bb/bb/pull/1945',
];

const DEMO_TS = new Date().setHours(10, 52, 0, 0);

/* Two fixed rounds. Round 2 questions refer to submitted round 1 answers. There is no branching. */
const ROUNDS = [
  { n: 1, intro: 'I have 10 questions about display, answer forms, drafts, and follow-ups. Answer any of them in any order.' },
  { n: 2, intro: 'Thanks for the first answers. These four follow-ups refer to what you submitted in round 1.' },
];

function quote(a) { return a ? '“' + a + '”' : null; }

function baseQuestions() {
  return [
    { id: 'q1', round: 1, group: 'display', type: 'single',
      title: 'Where should the new questions tool show by default?',
      help: 'The quick in-thread question stays as it is. This decides the default for the new tool only.',
      options: [
        { id: 'panel', label: 'Persistent side panel, next to Files' },
        { id: 'thread', label: 'Inside the thread transcript' },
        { id: 'agent', label: 'The agent chooses per request' },
      ] },
    { id: 'q2', round: 1, group: 'answers', type: 'multiple',
      title: 'Which answer forms must every question support?',
      options: [
        { id: 'detail', label: 'Extra detail on a chosen option' },
        { id: 'free', label: 'Free text instead of an option' },
        { id: 'files', label: 'File and image attachments' },
        { id: 'refs', label: 'Repository path and link references' },
      ] },
    { id: 'q3', round: 1, group: 'persist', type: 'single', askConfidence: true,
      title: 'Where should drafts be stored?',
      help: 'Drafts are answers that are typed but not submitted. The agent asked for a confidence level here.',
      options: [
        { id: 'local', label: 'Browser storage on this device only' },
        { id: 'thread', label: 'Thread state on the BB server' },
        { id: 'both', label: 'Both, server wins on conflict' },
      ] },
    { id: 'q4', round: 1, group: 'persist', type: 'single',
      title: 'Can the user submit some answers and leave the rest open?',
      help: 'There is no separate review step. Submitted answers go to the agent at once.',
      options: [
        { id: 'always', label: 'Yes, always' },
        { id: 'agent', label: 'Only when the agent allows it for that request' },
        { id: 'never', label: 'No, all questions at once' },
      ] },
    { id: 'q5', round: 1, group: 'agent', type: 'multiple',
      title: 'What may the agent do after it receives answers?',
      options: [
        { id: 'followup', label: 'Ask a follow-up question' },
        { id: 'challenge', label: 'Challenge an answer' },
        { id: 'conflict', label: 'Flag a conflict between two answers' },
        { id: 'evidence', label: 'Request evidence, such as a screenshot' },
      ] },
    { id: 'q6', round: 1, group: 'persist', type: 'single',
      title: 'What happens to drafts when the panel is closed?',
      options: [
        { id: 'keep', label: 'Keep them on this device' },
        { id: 'sync', label: 'Keep them and sync them to other devices' },
        { id: 'ask', label: 'Ask before closing' },
      ] },
    { id: 'q7', round: 1, group: 'answers', type: 'single',
      title: 'Should answers carry a confidence level?',
      options: [
        { id: 'optional', label: 'Optional, when the agent asks for it' },
        { id: 'required', label: 'Required on every answer' },
        { id: 'never', label: 'Never' },
      ] },
    { id: 'q8', round: 1, group: 'answers', type: 'multiple',
      title: 'Which reference types should an answer accept?',
      options: [
        { id: 'path', label: 'Repository file or folder path' },
        { id: 'lines', label: 'Path with a line range' },
        { id: 'url', label: 'External URL' },
        { id: 'thread', label: 'Link to another BB thread' },
      ] },
    { id: 'q9', round: 1, group: 'display', type: 'single',
      title: 'What should the summary tab show?',
      options: [
        { id: 'summary', label: 'Agent summary plus a decision list' },
        { id: 'open', label: 'Only the open decisions' },
        { id: 'table', label: 'A table of every answer' },
      ] },
    { id: 'q10', round: 1, group: 'agent', type: 'text', askReferences: true,
      title: 'Which existing tools have a question flow worth studying?',
      help: 'The agent asked for repository paths or links with this answer.' },

    { id: 'q11', round: 2, group: 'display', type: 'single', kind: 'Follow-up', cites: ['q1'],
      title: 'Which panel group should the questions panel join?',
      prose: (a) => (a[0] ? 'In round 1 you chose ' + quote(a[0]) + ' as the default display. ' : 'Round 1 asked where the tool should show by default, and that answer is not submitted yet. ') + 'Which panel group should the questions panel join?',
      options: [
        { id: 'files', label: 'Same group as Files' },
        { id: 'own', label: 'Its own group, opened by the agent' },
        { id: 'bottom', label: 'Bottom dock, next to Terminal' },
      ] },
    { id: 'q12', round: 2, group: 'persist', type: 'single', kind: 'Challenge', cites: ['q4'],
      title: 'Should the agent wait for a "done" signal before it acts on partial answers?',
      help: 'If the agent acts on each partial submit, it may act on incomplete input.',
      prose: (a) => (a[0] ? 'You answered ' + quote(a[0]) + ' to whether some answers can be submitted while the rest stay open. ' : 'Round 1 asked whether some answers can be submitted while the rest stay open, and that answer is not submitted yet. ') + 'If the agent acts on each partial submit, it may act on incomplete input. Should it wait for a "done" signal?',
      options: [
        { id: 'act', label: 'No, act on each submitted answer' },
        { id: 'done', label: 'Yes, add an explicit "I am done" action' },
        { id: 'idle', label: 'Act after the user is idle for a while' },
      ] },
    { id: 'q13', round: 2, group: 'persist', type: 'single', kind: 'Conflict', cites: ['q3', 'q6'],
      title: 'Drafts in browser storage cannot sync to other devices. Which answer should win?',
      prose: (a) => 'You chose ' + (quote(a[0]) || 'no submitted answer yet') + ' for draft storage and ' + (quote(a[1]) || 'no submitted answer yet') + ' for what happens when the panel closes. Drafts in browser storage cannot sync to other devices. Which answer should win?',
      options: [
        { id: 'q3', label: 'Drafts stay on this device' },
        { id: 'q6', label: 'Store drafts on the server so they sync' },
      ] },
    { id: 'q14', round: 2, group: 'answers', type: 'text', kind: 'Evidence', cites: ['q2'], askAttachments: true,
      title: 'Show one case where an image was required to answer a question.',
      help: 'The agent asked for a screenshot or file with this answer. A short note is enough if you have none at hand.',
      prose: (a) => (a[0] ? 'You listed ' + quote(a[0]) + ' as required answer forms. ' : 'Round 1 asked which answer forms are required, and that answer is not submitted yet. ') + 'Show one case where an image was required to answer a question.' },
  ];
}

/* Demo answers already submitted in round 1, so round 2 references have something to cite. */
const DEMO_ANSWERS = {
  q1: { selected: ['panel'] },
  q2: { selected: ['detail', 'free', 'files'] },
  q3: { selected: ['local'], confidence: 'low' },
  q4: { selected: ['always'], details: { always: 'The agent can ask again if it needs more.' } },
  q6: { selected: ['sync'] },
};

const AGENT_SUMMARY = {
  text: 'Goal: define a questions tool for BB that can hold many questions, keep drafts, and let the agent come back with follow-ups. Current direction: persistent panel with an in-thread option and partial submission. Open: where drafts live and whether the agent waits for a done signal.',
};

/* ============================ storage ============================ */
const STORAGE_KEY = 'bb-questions-prototype-v3';
const store = (function () {
  try {
    const k = STORAGE_KEY + ':probe';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return {
      kind: 'local',
      get() { try { return JSON.parse(window.localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; } },
      set(v) { try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); return true; } catch (e) { return false; } },
      clear() { try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {} },
    };
  } catch (e) {
    let mem = null;
    return { kind: 'memory', get() { return mem; }, set(v) { mem = v; return true; }, clear() { mem = null; } };
  }
})();
let lastSaveOk = true;

/* ============================ state ============================ */
function emptyAnswer() {
  return { selected: [], details: {}, text: '', attachments: [], refs: [], confidence: null, submitted: false, submittedAt: null, snapshot: null };
}
function initialState() {
  const s = {
    proposal: 'B',
    theme: 'dark',
    refMode: 'linked',
    panelOpen: true,
    mode: 'panel',
    tab: 'r2',
    questions: baseQuestions(),
    answers: {},
    events: [],
    collapsed: {},
    ui: {},
  };
  Object.keys(DEMO_ANSWERS).forEach(id => {
    const a = Object.assign(emptyAnswer(), { details: {} }, DEMO_ANSWERS[id]);
    a.submitted = true; a.submittedAt = DEMO_TS; a.demo = true; a.snapshot = snapshotOf(a);
    a.sent = { text: answerText(s.questions.find(q => q.id === id), a), confidence: a.confidence || null, at: DEMO_TS };
    s.answers[id] = a;
  });
  return s;
}
let S = initialState();
(function load() {
  const saved = store.get();
  if (saved && saved.questions && saved.answers) {
    S = Object.assign(initialState(), saved, { proposal: 'B', mode: 'panel', refMode: 'linked' });
  }
})();

let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const copy = Object.assign({}, S, { ui: {} });
    lastSaveOk = store.set(copy);
    renderStorageBadges();
  }, 120);
}
function ans(qid) { if (!S.answers[qid]) S.answers[qid] = emptyAnswer(); return S.answers[qid]; }
function qById(id) { return S.questions.find(q => q.id === id); }
function qIndex(id) { return S.questions.findIndex(q => q.id === id); }
function qLabel(q) { return 'Q' + (qIndex(q.id) + 1); }
function hasContent(a) { return !!(a && (a.selected.length || a.text.trim() || a.attachments.length || a.refs.length)); }
function snapshotOf(a) { return JSON.stringify([a.selected, a.details, a.text, a.attachments.map(x => x.name), a.refs, a.confidence]); }
function isDirty(a) { return a.submitted && a.snapshot !== snapshotOf(a); }
function answerState(qid) {
  const a = S.answers[qid];
  if (!a || !hasContent(a)) return 'empty';
  if (a.submitted && !isDirty(a)) return 'done';
  return 'draft';
}
function counts() {
  let empty = 0, draft = 0, done = 0;
  S.questions.forEach(q => { const s = answerState(q.id); if (s === 'empty') empty++; else if (s === 'draft') draft++; else done++; });
  return { empty, draft, done, total: S.questions.length, open: empty + draft };
}
function answerText(q, a) {
  if (!a || !hasContent(a)) return '';
  const parts = [];
  if (a.selected.length && q.options) parts.push(a.selected.map(id => { const o = q.options.find(x => x.id === id); const detail = (a.details[id] || '').trim(); return (o ? o.label : id) + (detail ? ' — ' + detail : ''); }).join(', '));
  if (a.text.trim()) parts.push(a.text.trim());
  if (a.attachments.length) parts.push(a.attachments.length + ' file' + (a.attachments.length > 1 ? 's' : ''));
  if (a.refs.length) parts.push(a.refs.length + ' ref' + (a.refs.length > 1 ? 's' : ''));
  return parts.join(' · ');
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function timeStr(ts) { const d = new Date(ts); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

/* ============================ actions ============================ */
function submitQuestion(qid) {
  const q = qById(qid), a = ans(qid);
  if (!hasContent(a)) return false;
  a.submitted = true; a.submittedAt = Date.now(); a.demo = false; a.snapshot = snapshotOf(a);
  a.sent = { text: answerText(q, a), confidence: a.confidence || null, at: a.submittedAt };
  return true;
}
function pendingIds() { return S.questions.filter(q => { const a = S.answers[q.id]; return hasContent(a) && (!a.submitted || isDirty(a)); }).map(q => q.id); }
function submitAnswered() {
  const submitted = pendingIds().filter(id => submitQuestion(id));
  if (!submitted.length) { toast('No draft answers to send yet.'); return; }
  S.events.push({ kind: 'user', ts: Date.now(), qids: submitted });
  const c = counts();
  toast('<b>Sent ' + submitted.map(id => qLabel(qById(id))).join(', ') + '</b>. ' + (c.open ? c.open + ' still open.' : 'All questions answered.'));
  render();
}
function clearAnswer(qid) { const a = ans(qid); const keep = { submitted: a.submitted, submittedAt: a.submittedAt, snapshot: a.snapshot, sent: a.sent, demo: a.demo }; S.answers[qid] = Object.assign(emptyAnswer(), keep); }
function goTo(qid) { const q = qById(qid); S.tab = 'r' + q.round; S.collapsed[qid] = false; if (!S.panelOpen && S.mode === 'panel') S.panelOpen = true; render(); focusQuestion(qid); }
function focusQuestion(qid) { requestAnimationFrame(() => { const el = document.querySelector('[data-q="' + qid + '"]'); if (el) { el.scrollIntoView({ block: 'nearest' }); const f = el.querySelector('input, textarea, button'); if (f) f.focus({ preventScroll: true }); } }); }
function resetDemo() { const keep = { theme: S.theme, refMode: S.refMode, proposal: S.proposal }; store.clear(); S = Object.assign(initialState(), keep); toast('Demo reset. Your answers are cleared. Demo answers are restored.'); render(); }
/* Text of the submitted answer, or null. Unsent edits never show here. */
function sentText(qid) { const a = S.answers[qid]; return a && a.submitted && a.sent ? a.sent.text : null; }
function qTitle(q) { return (S.refMode === 'prose' && q.prose) ? q.prose(q.cites.map(sentText)) : q.title; }
function qHelp(q) { return (S.refMode === 'prose' && q.prose) ? '' : (q.help || ''); }
function applyTheme() { document.documentElement.className = S.theme === 'light' ? 'light' : 'dark'; }
applyTheme();

function toast(html) {
  const box = document.getElementById('toasts');
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(() => t.remove(), 3600);
}

/* ============================ icons ============================ */
const I = {
  x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  files: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 2h6l4 4v8H3z"/><path d="M9 2v4h4"/></svg>',
  chat: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3h12v8H6l-3 3v-3H2z"/></svg>',
  q: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M6 6.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2M8 11.5h.01"/></svg>',
  clip: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10.5 5.5l-4.6 4.6a1.5 1.5 0 0 0 2.1 2.1l5-5a3 3 0 0 0-4.2-4.2l-5 5a4.5 4.5 0 0 0 6.4 6.4l3.6-3.6"/></svg>',
  link: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.5 2.5 0 0 1 3.5 3.5l-1 1M9 11.5l-1 1a2.5 2.5 0 0 1-3.5-3.5l1-1"/></svg>',
  chev: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4l4 4-4 4"/></svg>',
  panel: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10"/><path d="M10 3v10"/></svg>',
  file: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg>',
};

/* ============================ rendering ============================ */
const app = document.getElementById('app');

function render() {
  const active = document.activeElement;
  const activeKey = active && active.dataset ? active.dataset.focusKey : null;
  const selection = activeKey && typeof active.selectionStart === 'number'
    ? [active.selectionStart, active.selectionEnd, active.selectionDirection] : null;
  const scrolls = {};
  document.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });

  app.innerHTML = renderSwitcher() + renderIde();

  document.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });
  if (activeKey) { const el = document.querySelector('[data-focus-key="' + activeKey + '"]'); if (el) { el.focus({ preventScroll: true }); if (selection) el.setSelectionRange(...selection); } }
  persist();
}

function renderStorageBadges() {
  document.querySelectorAll('[data-storage-badge]').forEach(el => { el.outerHTML = storageBadge(); });
}
function storageBadge() {
  let text;
  if (store.kind === 'local' && lastSaveOk) text = 'Drafts saved on this device.';
  else if (store.kind === 'local') text = 'Draft too large to save. Kept only while this page is open.';
  else text = 'Drafts kept only while this page is open.';
  return '<span class="storage" data-storage-badge="foot">' + text + '</span>';
}

function renderSwitcher() {
  return '<div class="switcher" role="toolbar" aria-label="Demo controls">' +
    '<span class="label">Notebook side panel</span>' +
    '<div class="seg" role="group" aria-label="Theme"><button data-action="theme" data-theme="dark" aria-pressed="' + (S.theme === 'dark') + '">Dark</button><button data-action="theme" data-theme="light" aria-pressed="' + (S.theme === 'light') + '">Light</button></div>' +
    '<span class="spacer"></span>' +
    '<span class="demo">Demo. Sample answers are marked. Nothing is sent.</span>' +
    '<button class="btn sm ghost" data-action="reset">Reset</button></div>';
}

function renderIde() {
  const c = counts();
  const showPanel = S.mode === 'panel' && S.panelOpen;
  return '<div class="ide">' +
    '<div class="titlebar">' +
      '<div class="crumb"><b>bb</b><span class="sep">/</span><span class="hide-sm">bb-plugins</span><span class="sep hide-sm">/</span><span>Investigate questions plugin</span></div>' +
      '<span class="spacer"></span>' +
      '<button class="tb-btn" aria-pressed="false" title="Files panel">' + I.files + '<span>Files</span></button>' +
      '<button class="tb-btn" data-action="toggle-panel" aria-pressed="' + showPanel + '" title="Questions panel">' + I.q + '<span>Questions</span>' + (c.open ? '<span class="cnt">' + c.open + ' open</span>' : '') + '</button>' +
    '</div>' +
    '<div class="main">' + renderThread() + '</div>' +
    renderPanel() +
  '</div>';
}

function roundCounts(n) { const qs = S.questions.filter(q => q.round === n); return { total: qs.length, done: qs.filter(q => answerState(q.id) === 'done').length }; }

function renderThread() {
  let html = '<div class="thread" data-scroll="thread">';
  html += '<div class="msg user"><div class="who">You · 10:41</div><div class="body">Before you build the questions plugin, ask me everything you need. Use the new questions tool, not the quick one.</div></div>';
  ROUNDS.forEach((r, i) => {
    const rc = roundCounts(r.n);
    const last = i === ROUNDS.length - 1;
    html += '<div class="msg agent"><div class="who">Agent · ' + (r.n === 1 ? '10:41' : '10:53') + '</div><div class="body"><p>' + esc(r.intro) + '</p></div></div>';
    html += '<div class="toolcard"><div class="head"><span class="name">ask_questions</span><span>round ' + r.n + ' · ' + rc.total + ' questions · ' + 'panel' + '</span>' +
      '<span class="st ' + (rc.done < rc.total ? '' : 'ok') + '">' + rc.done + ' of ' + rc.total + ' submitted</span></div>';
    if (last) html += '<div class="foot">' + (S.panelOpen ? 'Open in the Questions panel.' : 'Questions panel is closed. Your drafts are kept.') +
      (S.panelOpen ? '' : '<button class="btn sm primary" data-action="open-panel">Reopen panel</button>') + '</div>';
    html += '</div>';
    if (r.n === 1) html += '<div class="msg user"><div class="who">You · 10:52 <span>· demo</span></div><div class="body">Submitted Q1, Q2, Q3, Q4, Q6.</div></div>';
  });
  S.events.forEach(ev => {
    html += '<div class="msg user"><div class="who">You · ' + timeStr(ev.ts) + '</div><div class="body">Submitted ' + ev.qids.map(id => { const q = qById(id); return q ? qLabel(q) : id; }).join(', ') + '.</div></div>';
  });
  html += '</div>';
  html += '<div class="composer"><div class="box"><span>Reply to the agent…</span><span class="kbd">⌘↵</span></div></div>';
  return html;
}

function renderPanel() {
  if (S.mode !== 'panel' || !S.panelOpen) return '<div class="panel" hidden></div>';
  return '<aside class="panel" style="--pw:460px" aria-label="Questions panel">' + renderPanelInner() + '</aside>';
}

function renderPanelInner() {
  const c = counts();
  let html = '<div class="phead"><div class="ptabs" role="tablist">';
  ROUNDS.forEach(r => { const rc = roundCounts(r.n); html += '<button role="tab" data-action="tab" data-tab="r' + r.n + '" aria-selected="' + (S.tab === 'r' + r.n) + '">Round ' + r.n + '<span class="n">' + rc.done + '/' + rc.total + '</span></button>'; });
  html += '<button role="tab" data-action="tab" data-tab="summary" aria-selected="' + (S.tab === 'summary') + '">Summary<span class="n">' + c.open + ' open</span></button></div>';
  html += '<span class="spacer"></span>';
  html += '<button class="icon-btn" data-action="close-panel" title="Close panel. Drafts are kept." aria-label="Close panel">' + I.x + '</button>';
  html += '</div>';
  html += '<div class="pbody" data-scroll="pbody-' + S.proposal + '-' + S.tab + '">';
  if (S.tab === 'summary') html += renderSummary();
  else html += renderB(+S.tab.slice(1));
  html += '</div>';
  html += renderFooter();
  return html;
}

function renderFooter() {
  const n = pendingIds().length;
  return '<div class="pfoot"><span class="muted" data-foot-help>' + (n ? 'Sends ' + n + ' draft answer' + (n > 1 ? 's' : '') + ' across all rounds.' : 'No draft answers to send.') + '</span>' +
    storageBadge() + '<span style="flex:1"></span>' +
    '<button class="btn sm primary" data-action="submit-all" ' + (n ? '' : 'disabled') + ' title="Sends every draft or changed answer in every round">Submit answered (' + n + ')</button></div>';
}

/* ----- shared question editor ----- */
function statusText(qid) {
  const st = answerState(qid), a = S.answers[qid];
  if (st === 'done') return 'Submitted at ' + timeStr(a.submittedAt);
  if (st === 'draft') return a.submitted ? 'changed since submit' : 'draft';
  return '';
}

/* Linked mode: a compact citation per referenced answer. Click reveals the earlier question and its submitted answer inline. */
function questionControls(qid) {
  const a = S.answers[qid], has = hasContent(a), st = answerState(qid);
  return '<span class="q-state" role="img" aria-label="' + esc(statusText(qid) || 'Unanswered') + '" title="' + esc(statusText(qid)) + '">' + (st === 'done' ? '✓' : '•') + '</span>' +
    '<button class="icon-btn" data-action="clear" data-q="' + qid + '" title="Clear answer" aria-label="Clear answer to ' + qLabel(qById(qid)) + '"' + (has ? '' : ' disabled tabindex="-1"') + '>' + I.x + '</button>';
}

function citeBlock(q) {
  if (!q.cites) return '';
  return '<div class="cites">' + q.cites.map(cid => {
    const cq = qById(cid), a = S.answers[cid], sent = sentText(cid);
    const open = !!S.ui['cite-' + q.id + '-' + cid];
    if (!open) return '<button class="cite" data-action="cite" data-q="' + q.id + '" data-ref="' + cid + '" aria-expanded="false"><span class="cite-source">Round ' + cq.round + ' · ' + qLabel(cq) + '</span>' +
      ' <span class="cq">' + esc(sent || 'No submitted answer yet') + '</span></button>';
    return '<div class="cite-box" data-cite-box><div class="ch">' +
      '<span title="' + (sent ? 'Submitted at ' + timeStr(a.sent.at) : 'No submitted answer') + '">Round ' + cq.round + ' · ' + qLabel(cq) + '</span>' +
      '<button class="icon-btn cite-jump" data-action="goto" data-q="' + cid + '" aria-label="Go to ' + qLabel(cq) + '" title="Go to source question">' +
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12 12 4M5 4h7v7"/></svg></button>' +
      '<button class="icon-btn cite-close" data-action="cite" data-q="' + q.id + '" data-ref="' + cid + '" aria-label="Collapse reference to ' + qLabel(cq) + '" aria-expanded="true" title="Collapse reference">' + I.x + '</button></div>' +
      '<div class="ct">' + esc(cq.title) + '</div>' +
      '<div class="ca"><span class="answer-label">Your answer</span>' + (sent ? esc(sent) + (a.sent.confidence ? ' · confidence ' + a.sent.confidence : '') : 'Not submitted yet.') + '</div>' +
      (a && isDirty(a) ? '<div class="hint">Unsent edits are not shown here.</div>' : '') + '</div>';
  }).join('') + '</div>';
}


function fileInfo(path) {
  const clean = path.replace(/\/$/, '');
  return { name: clean.split('/').pop(), path };
}
function fileIcon(path) {
  if (/^https?:/.test(path)) return I.link;
  if (/\.(tsx?|jsx?|json|svg)$/.test(path)) return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m5 4-4 4 4 4m6-8 4 4-4 4M9.5 2l-3 12"/></svg>';
  return I.file;
}
function fileMatches(qid) {
  const query = (S.ui['query-' + qid] || '').trim();
  const matches = SAMPLE_PATHS.filter(p => p.toLowerCase().includes(query.toLowerCase()));
  if (query && !matches.includes(query) && (/^https?:\/\//.test(query) || query.includes('/'))) matches.push(query);
  return matches;
}
function renderFilePicker(q) {
  const a = ans(q.id), open = !!S.ui['files-' + q.id], matches = fileMatches(q.id);
  const active = Math.min(S.ui['file-index-' + q.id] || 0, Math.max(matches.length - 1, 0));
  return '<div class="field ref-picker" data-picker="' + q.id + '"><div class="file-input">' +
    '<svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>' +
    '<input class="in" role="combobox" aria-autocomplete="list" aria-expanded="' + open + '" aria-controls="file-list-' + q.id + '"' + (open && matches.length ? ' aria-activedescendant="file-option-' + q.id + '-' + active + '"' : '') +
    ' aria-label="Search files or paste a link" placeholder="Search files or paste a link" data-action="ref-input" data-q="' + q.id + '" data-focus-key="r-' + q.id + '" value="' + esc(S.ui['query-' + q.id] || '') + '">' +
    '<button class="file-caret" data-action="file-toggle" data-q="' + q.id + '" aria-label="' + (open ? 'Close file search' : 'Open file search') + '" aria-expanded="' + open + '"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m4 6 4 4 4-4"/></svg></button></div>' +
    (open ? '<div class="file-results" role="listbox" aria-label="Files" aria-multiselectable="true" id="file-list-' + q.id + '">' +
      (matches.length ? matches.map((p, i) => { const f = fileInfo(p), selected = a.refs.includes(p); return '<button type="button" role="option" tabindex="-1" id="file-option-' + q.id + '-' + i + '" aria-selected="' + selected + '" class="file-option' + (i === active ? ' active' : '') + '" data-action="ref-pick" data-q="' + q.id + '" data-ref="' + esc(p) + '">' + fileIcon(p) + '<span class="file-name">' + esc(f.name) + '</span><span class="file-path">' + esc(f.path) + '</span><span class="file-check">' + (selected ? '✓' : '') + '</span></button>'; }).join('') : '<div class="file-empty">No matching files</div>') + '</div>' : '') +
    '<div class="file-badges">' + a.refs.map((p, i) => '<span class="file-badge" title="' + esc(p) + '">' + fileIcon(p) + '<button class="file-badge-label" data-action="ref-open" data-ref="' + esc(p) + '">' + esc(fileInfo(p).name) + '</button><button class="icon-btn" data-action="ref-remove" data-q="' + q.id + '" data-i="' + i + '" aria-label="Remove ' + esc(p) + '">' + I.x + '</button></span>').join('') + '</div></div>';
}
function selectFile(qid, path) {
  const a = ans(qid);
  a.refs = a.refs.includes(path) ? a.refs.filter(p => p !== path) : a.refs.concat(path);
  S.ui['files-' + qid] = true;
  render();
  document.querySelector('[data-focus-key="r-' + qid + '"]').focus();
}

function renderEditor(q, opt) {
  opt = opt || {};
  const a = ans(q.id);
  const showText = q.type === 'text' || a.text.trim() || S.ui['text-' + q.id];
  const help = qHelp(q);
  let html = '<div class="q ' + (opt.hideTitle ? 'notitle' : '') + '" data-q="' + q.id + '">';
  if (!opt.hideTitle) html += '<div class="qtop"><span class="qnum">' + qLabel(q) + '</span><span class="qtitle">' + esc(qTitle(q)) + '</span></div>';
  if (help) html += '<div class="qhelp">' + esc(help) + '</div>';
  html += citeBlock(q);

  if (q.options) {
    html += '<div class="opts" role="group" aria-label="' + esc(q.title) + '">';
    q.options.forEach(o => {
      const on = a.selected.includes(o.id);
      const hasDetail = a.details[o.id] != null;
      html += '<div class="opt ' + (on ? 'on' : '') + '"><label><input type="' + (q.type === 'single' ? 'radio' : 'checkbox') + '" name="' + q.id + '" data-action="select" data-q="' + q.id + '" data-opt="' + o.id + '" ' + (on ? 'checked' : '') + '><span class="txt">' + esc(o.label) + '</span>' +
        (on ? '<button type="button" class="detail-toggle" data-action="detail-toggle" data-q="' + q.id + '" data-opt="' + o.id + '">' + (hasDetail ? 'Remove detail' : '+ detail') + '</button>' : '') + '</label>';
      if (on && hasDetail) html += '<div class="detail"><textarea class="ta" rows="2" placeholder="Why this option, or what to watch for" data-action="detail-input" data-q="' + q.id + '" data-opt="' + o.id + '" data-focus-key="d-' + q.id + '-' + o.id + '">' + esc(a.details[o.id]) + '</textarea></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  if (showText || q.askAttachments) html += '<div class="field' + (q.askAttachments ? ' answer-composer' : '') + '"><textarea id="t-' + q.id + '" class="ta" rows="2" aria-label="' + (q.options ? 'Answer in your own words' : 'Your answer') + '" data-action="text-input" data-q="' + q.id + '" data-focus-key="t-' + q.id + '" placeholder="' + (q.options ? 'Something else, or a mix of options' : 'Type here') + '">' + esc(a.text) + '</textarea>' +
    (q.askAttachments ? '<button class="icon-btn attach-icon" data-action="attach" data-q="' + q.id + '" title="Attach file or image" aria-label="Attach file or image">' + I.clip + '</button><input type="file" class="sr" multiple data-action="attach-input" data-q="' + q.id + '" id="f-' + q.id + '" aria-label="Choose files">' : '') + '</div>';
  html += '<div class="actions">' +
    (q.options && !showText ? '<button class="text-answer" data-action="text-toggle" data-q="' + q.id + '">Type an answer</button>' : '') +
    '</div>' +
    (q.askConfidence ? '<div class="confidence-row"><span class="hint">Confidence</span><div class="conf" role="group" aria-label="Confidence">' + ['low', 'medium', 'high'].map(l => '<button data-action="conf" data-q="' + q.id + '" data-v="' + (a.confidence === l ? '' : l) + '" aria-pressed="' + (a.confidence === l) + '">' + l + '</button>').join('') + '</div></div>' : '');
  if (a.attachments.length) html += '<div class="field"><div class="att-list" style="margin-top:0">' + a.attachments.map((f, i) => '<span class="att">' + (f.dataUrl ? '<img src="' + f.dataUrl + '" alt="">' : I.file) + '<span class="fname" title="' + esc(f.name) + '">' + esc(f.name) + '</span><span class="hint">' + f.size + '</span><button class="x" data-action="att-remove" data-q="' + q.id + '" data-i="' + i + '" aria-label="Remove ' + esc(f.name) + '">' + I.x + '</button></span>').join('') + '</div></div>';
  if (q.askReferences) html += renderFilePicker(q);
  html += '</div>';
  return html;
}

/* ----- summary: one page for every round ----- */
function renderSummary() {
  const decided = S.questions.filter(q => answerState(q.id) === 'done');
  const open = S.questions.filter(q => answerState(q.id) !== 'done');
  const item = (q, cls) => { const a = S.answers[q.id]; return '<div class="item ' + cls + '"><span class="k">' + qLabel(q) + '</span><div class="t"><button class="link" data-action="goto" data-q="' + q.id + '">' + esc(q.title) + '</button><div class="ans">Round ' + q.round + (a && hasContent(a) ? ' · ' + (cls ? 'draft: ' : '') + esc(answerText(q, a)) + (a.confidence ? ' · confidence ' + a.confidence : '') : '') + '</div></div></div>'; };
  let html = '<div class="summary">';
  html += '<div class="agent-sum"><div class="h">Agent summary · simulated</div>' + esc(AGENT_SUMMARY.text) + '</div>';
  html += '<div><h4>Submitted · ' + decided.length + '</h4><div class="list">' + (decided.length ? decided.map(q => item(q, '')).join('') : '<div class="empty">Nothing submitted yet.</div>') + '</div></div>';
  html += '<div><h4>Open · ' + open.length + '</h4><div class="list">' + (open.length ? open.map(q => item(q, 'open')).join('') : '<div class="empty">Everything is answered.</div>') + '</div></div>';
  html += '</div>';
  return html;
}

/* ----- Notebook: the active round as one document, grouped under quiet headings ----- */
function renderB(round) {
  const qs = S.questions.filter(q => q.round === round);
  let html = '';
  GROUPS.forEach(g => {
    const gq = qs.filter(q => q.group === g.id);
    if (!gq.length) return;
    html += '<h3 class="nb-h">' + g.title + '</h3>';
    gq.forEach(q => {
      html += '<div class="qb"><div class="qrow"><span class="num">' + qLabel(q) + '</span><span class="t">' + esc(qTitle(q)) + '</span><span class="q-controls' + (hasContent(S.answers[q.id]) ? '' : ' is-empty') + '" data-controls="' + q.id + '">' + questionControls(q.id) + '</span></div>' + renderEditor(q, { hideTitle: true }) + '</div>';
    });
  });
  return html;
}

/* ============================ events ============================ */
function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action, qid = el.dataset.q;
  switch (act) {
    case 'cite': { const k = 'cite-' + qid + '-' + el.dataset.ref; S.ui[k] = !S.ui[k]; render(); break; }
    case 'text-toggle': S.ui['text-' + qid] = true; render(); { const t = document.querySelector('[data-focus-key="t-' + qid + '"]'); if (t) t.focus(); } break;
    case 'toggle-panel': S.mode = 'panel'; S.panelOpen = !S.panelOpen; render(); break;
    case 'open-panel': S.mode = 'panel'; S.panelOpen = true; render(); break;
    case 'close-panel': S.panelOpen = false; toast('Panel closed. Your drafts are kept. Reopen it from the title bar.'); render(); break;
    case 'tab': S.tab = el.dataset.tab; render(); break;
    case 'reset': resetDemo(); break;
    case 'goto': if (qid) goTo(qid); break;
    case 'collapse': S.collapsed[qid] = !(el.getAttribute('aria-expanded') === 'false'); render(); break;
    case 'theme': S.theme = el.dataset.theme; applyTheme(); render(); break;
    case 'detail-toggle': { e.preventDefault(); const a = ans(qid); const o = el.dataset.opt; if (a.details[o] != null) delete a.details[o]; else a.details[o] = ''; render(); if (a.details[o] != null) { const t = document.querySelector('[data-focus-key="d-' + qid + '-' + o + '"]'); if (t) t.focus(); } break; }
    case 'attach': document.getElementById('f-' + qid).click(); break;
    case 'att-remove': ans(qid).attachments.splice(+el.dataset.i, 1); render(); break;
    case 'ref-input': if (!S.ui['files-' + qid]) { S.ui['files-' + qid] = true; render(); } break;
    case 'file-toggle': S.ui['files-' + qid] = !S.ui['files-' + qid]; render(); document.querySelector('[data-focus-key="r-' + qid + '"]').focus(); break;
    case 'ref-pick': selectFile(qid, el.dataset.ref); break;
    case 'ref-remove': ans(qid).refs.splice(+el.dataset.i, 1); render(); break;
    case 'ref-open': { const r = el.dataset.ref; toast(/^https?:/.test(r) ? '<b>Open link</b> ' + esc(r) + ' (demo: would open in the browser)' : '<b>Open in editor</b> ' + esc(r) + ' (demo: would open the file in BB)'); break; }
    case 'conf': ans(qid).confidence = el.dataset.v || null; render(); break;
    case 'clear': clearAnswer(qid); render(); break;
    case 'submit-all': submitAnswered(); break;
  }
});

app.addEventListener('change', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action, qid = el.dataset.q;
  if (act === 'select') {
    const q = qById(qid), a = ans(qid), o = el.dataset.opt;
    if (q.type === 'single') a.selected = [o];
    else if (el.checked) { if (!a.selected.includes(o)) a.selected.push(o); }
    else { a.selected = a.selected.filter(x => x !== o); delete a.details[o]; }
    render();
  } else if (act === 'attach-input') {
    const files = Array.from(el.files || []);
    const a = ans(qid);
    let pending = files.length;
    if (!pending) return;
    files.forEach(f => {
      const entry = { name: f.name, size: fmtSize(f.size), dataUrl: null };
      a.attachments.push(entry);
      if (/^image\//.test(f.type) && f.size < 400 * 1024) {
        const rd = new FileReader();
        rd.onload = () => { entry.dataUrl = rd.result; if (--pending === 0) render(); };
        rd.onerror = () => { if (--pending === 0) render(); };
        rd.readAsDataURL(f);
      } else { if (--pending === 0) render(); }
    });
    render();
  }
});

function refreshFileResults(qid) {
  const picker = document.querySelector('[data-picker="' + qid + '"]');
  const scratch = document.createElement('div');
  scratch.innerHTML = renderFilePicker(qById(qid));
  const results = scratch.querySelector('.file-results');
  const old = picker.querySelector('.file-results');
  if (old) old.replaceWith(results); else picker.querySelector('.file-input').after(results);
  const input = picker.querySelector('[role="combobox"]');
  input.setAttribute('aria-expanded', 'true');
  const active = results.querySelector('.active');
  if (active) input.setAttribute('aria-activedescendant', active.id);
  else input.removeAttribute('aria-activedescendant');
  const caret = picker.querySelector('.file-caret');
  caret.setAttribute('aria-expanded', 'true');
  caret.setAttribute('aria-label', 'Close file search');
}

app.addEventListener('pointermove', e => {
  const option = e.target.closest('.file-option');
  if (!option) return;
  const list = option.closest('.file-results');
  const options = [...list.querySelectorAll('.file-option')];
  S.ui['file-index-' + option.dataset.q] = options.indexOf(option);
  options.forEach(row => row.classList.toggle('active', row === option));
  option.closest('.ref-picker').querySelector('[role="combobox"]').setAttribute('aria-activedescendant', option.id);
});

app.addEventListener('input', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action, qid = el.dataset.q;
  if (act === 'ref-input') { S.ui['query-' + qid] = el.value; S.ui['files-' + qid] = true; S.ui['file-index-' + qid] = 0; refreshFileResults(qid); }
  else if (act === 'text-input') { ans(qid).text = el.value; softUpdate(qid); }
  else if (act === 'detail-input') { ans(qid).details[el.dataset.opt] = el.value; softUpdate(qid); }
});

app.addEventListener('keydown', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.action === 'ref-input') {
    const qid = el.dataset.q, matches = fileMatches(qid);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); const step = e.key === 'ArrowDown' ? 1 : -1;
      S.ui['file-index-' + qid] = S.ui['files-' + qid] ? Math.max(0, Math.min(matches.length - 1, (S.ui['file-index-' + qid] || 0) + step)) : 0;
      S.ui['files-' + qid] = true; render(); return;
    }
    if (e.key === 'Enter') { e.preventDefault(); const p = matches[S.ui['file-index-' + qid] || 0]; if (p) selectFile(qid, p); return; }
    if (e.key === 'Escape' && S.ui['files-' + qid]) { e.preventDefault(); S.ui['files-' + qid] = false; render(); return; }
  }
  if (e.key === 'Escape' && S.mode === 'panel' && S.panelOpen && el.closest && el.closest('.panel')) { S.panelOpen = false; render(); const b = document.querySelector('[data-action="toggle-panel"]'); if (b) b.focus(); toast('Panel closed. Drafts are kept.'); }
});

/* Update status chips and buttons without a full re-render while typing. */
function softUpdate(qid) {
  persist();
  document.querySelectorAll('[data-controls="' + qid + '"]').forEach(el => {
    el.innerHTML = questionControls(qid);
    el.classList.toggle('is-empty', !hasContent(S.answers[qid]));
  });
  const n = pendingIds().length;
  document.querySelectorAll('[data-action="submit-all"]').forEach(b => { b.disabled = !n; b.textContent = 'Submit answered (' + n + ')'; });
  document.querySelectorAll('[data-foot-help]').forEach(el => { el.textContent = n ? 'Sends ' + n + ' draft answer' + (n > 1 ? 's' : '') + ' across all rounds.' : 'No draft answers to send.'; });
}

window.addEventListener('resize', () => { /* layout is CSS-driven */ });

document.addEventListener('click', e => {
  if (e.target.closest('.ref-picker')) return;
  document.querySelectorAll('.ref-picker').forEach(p => {
    const id = p.dataset.picker; S.ui['files-' + id] = false;
    p.querySelector('.file-results')?.remove();
    p.querySelector('[role=combobox]').setAttribute('aria-expanded', 'false');
    p.querySelector('[role=combobox]').removeAttribute('aria-activedescendant');
  });
});

render();
})();
</script>
